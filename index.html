<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SE3354 Class Project UI</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #1a237e;
    }
    .box {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    code {
      display: block;
      margin: 1rem 0;
      padding: 0.75rem;
      background: #e3f2fd;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: left;
      word-break: break-all;
    }
    a {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.75rem 1.25rem;
      background: #1565c0;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
    }
    a:hover { background: #0d47a1; }
    p { color: #5c6bc0; font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1 style="margin: 0 0 0.5rem; font-size: 1.35rem;">Class project UI</h1>
    <p>
      The interactive demo is a <strong>React (Vite)</strong> app under <code>class-project-ui/</code>.
    </p>
    <p>In a terminal, run:</p>
    <code>cd class-project-ui<br>npm install<br>npm start</code>
    <p>Then open <strong>http://localhost:5173</strong> in your browser.</p>
    <p style="font-size:0.85rem;">Static HTML originals are in <code>class-project-ui/archive-static-html/</code>.</p>
  </div>
</body>
</html>
